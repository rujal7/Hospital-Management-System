<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · MediCare</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="login"><form method="post" class="login-card"><div class="logo">✚</div><h1>Welcome to MediCare</h1><p>Sign in to the Hospital Management System</p>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="flash {{category}}">{{message}}</div>{% endfor %}<label>Email address<input type="email" name="email" value="admin@medicare.com" required></label><label>Password<input type="password" name="password" value="Admin@123" required></label><button>Sign in securely</button><small>Demo: admin@medicare.com / Admin@123</small></form></body></html>
